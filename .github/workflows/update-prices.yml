name: Update Prices

permissions:
  contents: read

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      AMAZON_MARKETPLACE: www.amazon.com
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install gspread google-auth

      - name: Verify configuration
        shell: bash
        run: |
          missing=0
          for name in \
            AMAZON_CREATORS_CREDENTIAL_ID \
            AMAZON_CREATORS_CREDENTIAL_SECRET \
            AMAZON_CREATORS_CREDENTIAL_VERSION \
            AMAZON_PARTNER_TAG \
            GOOGLE_SERVICE_ACCOUNT_JSON
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a repository Actions secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Update prices
        run: python scripts/update_prices.py
